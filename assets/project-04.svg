<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Katiwala: Filipino home-services marketplace with booking flows and provider ID verification."><title>Katiwala: Filipino home-services marketplace with booking flows and provider ID verification.</title><style>@font-face{font-family:'M7';src:url(data:font/woff;base64,) format('woff')}.M7{font-family:'M7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F7';src:url(data:font/woff;base64,) format('woff')}.F7{font-family:'F7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F5';src:url(data:font/woff;base64,) format('woff')}.F5{font-family:'F5',ui-rounded,system-ui,sans-serif}
    .print{animation:pr 3s ease-in-out infinite}@keyframes pr{0%{transform:translateY(70px)}45%,85%{transform:translateY(0)}100%{transform:translateY(70px)}}
    .cell{transform-box:fill-box;transform-origin:center;animation:cell 3.2s ease-out infinite}
