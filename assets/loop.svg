<svg xmlns="http://www.w3.org/2000/svg" width="996" height="300" viewBox="0 0 996 300" role="img" aria-label="My production loop: Understand, Build, Verify, repeat."><title>My production loop: Understand, Build, Verify, repeat.</title><style>@font-face{font-family:'M7';src:url(data:font/woff;base64,) format('woff')}.M7{font-family:'M7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F7';src:url(data:font/woff;base64,) format('woff')}.F7{font-family:'F7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F5';src:url(data:font/woff;base64,) format('woff')}.F5{font-family:'F5',ui-rounded,system-ui,sans-serif}
    .flow{animation:fl .8s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}
    .pop{animation:pop 2.4s ease-in-out infinite}@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
