<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="PesoWise: Personal spending tracker with auth and protected user data flows."><title>PesoWise: Personal spending tracker with auth and protected user data flows.</title><style>@font-face{font-family:'M7';src:url(data:font/woff;base64,) format('woff')}.M7{font-family:'M7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F7';src:url(data:font/woff;base64,) format('woff')}.F7{font-family:'F7',ui-rounded,system-ui,sans-serif}@font-face{font-family:'F5';src:url(data:font/woff;base64,) format('woff')}.F5{font-family:'F5',ui-rounded,system-ui,sans-serif}
    .print{animation:pr 3s ease-in-out infinite}@keyframes pr{0%{transform:translateY(70px)}45%,85%{transform:translateY(0)}100%{transform:translateY(70px)}}
    .cell{transform-box:fill-box;transform-origin:center;animation:cell 3.2s ease-out infinite}
    @keyframes cell{0%{transform:scale(0)}12%,85%{transform:scale(1)}100%{transform:scale(0)}}
    .drop{animation:dr 1s ease-in-out infinite}@keyframes dr{50%{transform:translateY(4px)}}
    .beat{stroke-dasharray:180;animation:beat 2s linear infinite}@keyframes beat{from{stroke-dashoffset:180}to{stroke-dashoffset:-180}}
    .heart{transform-box:fill-box;transform-origin:center;animation:hb 1s ease-in-out infinite}
    @keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(.95)}45%{transform:scale(1.1)}}
    .wrench{transform-box:fill-box;transform-origin:50% 90%;animation:wr 1.4s ease-in-out infinite}
    @keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
    .blurry{animation:bx 4s ease-in-out infinite}@keyframes bx{0%,15%{opacity:1}55%,85%{opacity:0}100%{opacity:1}}
    .scan{animation:sc 4s ease-in-out infinite}@keyframes sc{0%,10%{transform:translateX(0);opacity:1}55%{transform:translateX(124px);opacity:1}62%,100%{transform:translateX(124px);opacity:0}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 3s ease-in-out infinite}
    @keyframes bar{0%{transform:scaleY(.15)}40%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
    .coin{animation:coin 1.5s ease-in-out infinite}@keyframes coin{50%{transform:translateY(-8px)}}
    .win{animation:win 3s ease-in-out infinite}@keyframes win{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pu 1.6s ease-in-out infinite}
        @keyframes pu{50%{transform:scale(.6);opacity:.5}}
        .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
        @keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.55) rotate(45deg)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
