<title>Birth Injury Results Section</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: no cards. The amounts are the design: a four-column ledger of large figures on navy,
   hairline rules between them, the largest result marked in amber. Below, an upright pull quote
   with one big amber quote mark. Single navy theme on purpose, matching the site. */
.bkres {
  --navy: #10233d;
  --on-navy: #dfe6f0;
  --on-navy-muted: #9fb0c6;
  --rule: rgba(255,255,255,0.14);
  --rule-strong: rgba(255,255,255,0.32);
  --amber: #f4b860;        /* shared accent across the page */

  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Source Sans Pro", "Segoe UI", Arial, sans-serif;

  color-scheme: dark;
  background: var(--navy);
  color: var(--on-navy);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.6;
  padding-block: clamp(56px, 8vw, 112px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body { background: #10233d; margin: 0; }
.bkres *, .bkres *::before, .bkres *::after { box-sizing: border-box; }

.bkres__inner {
  max-width: 1160px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: clamp(40px, 5vw, 64px);
}

/* Header */
.bkres__head {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 16px 40px;
}
.bkres__eyebrow {
  margin: 0 0 12px;
  font-family: var(--display);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
}
.bkres h2 {
  margin: 0;
  max-width: 18ch;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2rem, 3.6vw, 2.75rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: #ffffff;
  text-wrap: balance;
}
.bkres__more {
  font-family: var(--display);
  font-weight: 600;
  font-size: 0.9375rem;
  color: #ffffff;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  white-space: nowrap;
}
.bkres__more:hover { text-decoration-thickness: 2px; }

/* Ledger */
.bkres__ledger { display: flex; flex-direction: column; gap: 16px; }
.bkres__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule);
}
.bkres__item {
  position: relative;
  padding: 28px 24px 28px 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.bkres__item + .bkres__item { padding-left: 24px; border-left: 1px solid var(--rule); }
.bkres__item--top::before {
  content: "";
  position: absolute;
  top: -1px; left: 0; right: 24px;
  height: 3px;
  background: var(--amber);
}
.bkres__amount {
  margin: 0;
  display: flex;
  flex-direction: column;
  font-family: var(--display);
  color: #ffffff;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.bkres__amount b {
  font-weight: 700;
  font-size: clamp(2.5rem, 4.6vw, 3.75rem);
  letter-spacing: -0.035em;
}
.bkres__amount b sup {
  font-size: 0.45em;
  font-weight: 600;
  vertical-align: 0.95em;
  margin-right: 0.06em;
  letter-spacing: 0;
}
.bkres__amount span {
  margin-top: 8px;
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--on-navy-muted);
}
.bkres__type {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--display);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--on-navy);
}
.bkres__item--top .bkres__type { color: var(--amber); }
.bkres__note {
  margin: 0;
  font-size: 0.875rem;
  color: var(--on-navy-muted);
}

/* Quote */
.bkres__quote {
  margin: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px clamp(20px, 3vw, 40px);
  max-width: 920px;
}
.bkres__mark {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(5rem, 9vw, 7.5rem);
  line-height: 0.8;
  color: var(--amber);
  user-select: none;
}
.bkres__quote blockquote { margin: 0; }
.bkres__quote blockquote p {
  margin: 0;
  font-size: clamp(1.1875rem, 1.8vw, 1.4375rem);
  line-height: 1.55;
  color: #ffffff;
  text-wrap: pretty;
}
.bkres__quote figcaption {
  grid-column: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
}
.bkres__avatar {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--rule-strong);
  font-family: var(--display);
  font-weight: 600;
  font-size: 0.9375rem;
  color: #ffffff;
}
.bkres__who { display: flex; flex-direction: column; line-height: 1.3; }
.bkres__who b { font-family: var(--display); font-weight: 600; font-size: 1rem; color: #ffffff; }
.bkres__who span { font-size: 0.875rem; color: var(--on-navy-muted); }

.bkres a:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

/* Responsive */
@media (max-width: 900px) {
  .bkres__list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bkres__item:nth-child(3) { padding-left: 0; border-left: 0; }
  .bkres__item:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 460px) {
  .bkres__item { padding: 22px 16px 22px 0; }
  .bkres__item + .bkres__item { padding-left: 16px; }
  .bkres__item:nth-child(3) { padding-left: 0; }
  .bkres__item--top::before { right: 16px; }
  .bkres__amount b { font-size: 2.25rem; }
  .bkres__quote { grid-template-columns: minmax(0, 1fr); }
  .bkres__mark { font-size: 4.5rem; margin-bottom: -24px; }
  .bkres__quote figcaption { grid-column: 1; }
}
</style>

<section class="bkres" id="results" aria-labelledby="bkres-title">
  <div class="bkres__inner">

    <header class="bkres__head">
      <div>
        <p class="bkres__eyebrow">Case results</p>
        <h2 id="bkres-title">Our results for birth injury families</h2>
      </div>
      <a class="bkres__more" href="/case-results">See more case results</a>
    </header>

    <div class="bkres__ledger">

        <li class="bkres__item bkres__item--top">
          <p class="bkres__amount"><b><sup>$</sup>8.3</b><span>million</span></p>

        </li>
        <li class="bkres__item">
          <p class="bkres__amount"><b><sup>$</sup>8.25</b><span>million</span></p>

        </li>
        <li class="bkres__item">
          <p class="bkres__amount"><b><sup>$</sup>8.12</b><span>million</span></p>
          <p class="bkres__type">Birth injury</p>
        </li>
        <li class="bkres__item">
          <p class="bkres__amount"><b><sup>$</sup>6.7</b><span>million</span></p>
          <p class="bkres__type">Birth injury</p>
        </li>
      </ul>
      <p class="bkres__note">Every case is unique. Past results do not guarantee a similar outcome.</p>
    </div>

    <figure class="bkres__quote">

      <figcaption>

  </div>
</section>
