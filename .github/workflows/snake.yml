name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github&color_snake=#FF6B6B&color_dots=#EDE6FF,#C7B6FF,#8B5CF6,#6D3FE0,#4C1D95
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFC93C&color_dots=#1E1B4B,#3B2F7A,#6D3FE0,#8B5CF6,#C7B6FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
